run_name: evidence-review

models:
  deepseek:
    provider: fireworks
    id: accounts/fireworks/models/deepseek-v4p1-flash-1017
    family: deepseek
    temperature: 1.0
    price: {in_per_m: 0.30, cached_per_m: 0.006, out_per_m: 1.20}
  glm:
    provider: fireworks
    id: accounts/fireworks/models/glm-5p3-flash
    family: zhipu
    price: {in_per_m: 0.15, cached_per_m: 0.03, out_per_m: 0.50}

peers:
  - {id: R1, model: deepseek, lens: quantitative evidence and effect sizes}
  - {id: R2, model: glm, lens: source credibility and research methods}
  - {id: R3, model: deepseek, lens: "costs, operations and synthesis editing"}
  - {id: R4, model: glm, lens: "people, wellbeing and retention"}

# Sized for a live demo: four starting tasks for four peers, then one integration task.
budget:
  swarm_usd: 0.6
  peer_usd: 0.25
  wall_clock_s: 480
  stagger_s: 3
  idle_poll_s: 6
  stall_after_s: 150

data_dir: examples/evidence_review/sources
