[project]
name = "agora"
version = "0.1.0"
description = "Supervisor-free multi-agent framework on LangChain Deep Agents"
readme = "README.md"
authors = [
    { name = "Chaminda Wijayasundara", email = "cwijayasundara@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "langchain-fireworks==1.7.1",
    "langchain-anthropic==1.7.6",
    "langchain-openai==1.7.2",
    "pyyaml>=6.0",
    "pydantic>=2.7.4,<3",
]

[project.scripts]
agora = "agora.cli:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls real model APIs"]
addopts = "-m 'not live'"
