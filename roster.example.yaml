run_name: example

models:
  deepseek:
    provider: fireworks
    id: accounts/fireworks/models/deepseek-v4p1-flash-1017
    family: deepseek
    temperature: 1.0
    price: {in_per_m: 0.30, cached_per_m: 0.006, out_per_m: 1.20}
  minimax:
    provider: fireworks
    id: accounts/fireworks/models/minimax-m3p1-flash
    family: minimax
    price: {in_per_m: 0.15, cached_per_m: 0.015, out_per_m: 0.60}
  glm:
    provider: fireworks
    id: accounts/fireworks/models/glm-5p3-flash
    family: zhipu
    price: {in_per_m: 0.15, cached_per_m: 0.03, out_per_m: 0.50}
  haiku:
    provider: anthropic
    id: claude-haiku-5-5
    family: anthropic
    price: {in_per_m: 0.10, cached_per_m: 0.01, out_per_m: 0.50}
    tiers:
      - above_prompt_tokens: 100000
        price: {in_per_m: 0.50, cached_per_m: 0.05, out_per_m: 2.50}
  luna:
    provider: openai
    id: gpt-6-luna
    family: openai
    api: responses
    price: {in_per_m: 0.10, cached_per_m: 0.01, out_per_m: 0.50}
    tiers:
      - above_prompt_tokens: 272000
        price: {in_per_m: 0.20, cached_per_m: 0.02, out_per_m: 0.75}

peers:
  - {id: P01, model: deepseek, lens: financial model and unit economics}
  - {id: P02, model: deepseek, lens: go/no-go recommendation and scenario logic}
  - {id: P03, model: haiku, lens: regulatory and data-protection risk}
  - {id: P04, model: haiku, lens: cross-section validation and review}
  - {id: P05, model: minimax, lens: market sizing, peer_usd: 0.6}
  - {id: P06, model: minimax, lens: pricing and packaging, peer_usd: 0.6}
  - {id: P07, model: luna, lens: competitor landscape and price benchmarking}
  - {id: P08, model: luna, lens: go-to-market and sales capacity}
  - {id: P09, model: glm, lens: customer-interview evidence}
  - {id: P10, model: glm, lens: operations cost and integration editing}

budget:
  swarm_usd: 10
  peer_usd: 1.5
  wall_clock_s: 3600
